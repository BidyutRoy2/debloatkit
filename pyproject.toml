[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debloatkit"
version = "1.0.0"
description = "Safe Android & Google TV debloater over Wi-Fi ADB — dry-run first, one-command restore."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bidyut Roy" }]
keywords = ["android", "adb", "debloat", "android-tv", "google-tv", "privacy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
debloatkit = "debloatkit.cli:main"

[project.urls]
Homepage = "https://github.com/BidyutRoy2/debloatkit"
Issues = "https://github.com/BidyutRoy2/debloatkit/issues"

[tool.setuptools.packages.find]
include = ["debloatkit*"]
